<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加班工時計算</title><style>body{margin:0;background:#f4f6fa;font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#17243a}.wrap{max-width:470px;margin:7vh auto;padding:20px}.panel{background:white;border-radius:18px;padding:28px;box-shadow:0 8px 28px #15233b15}h1{font-size:26px;margin:0 0 9px}.hint{color:#627189;font-size:14px;margin:0 0 24px}label{display:block;font-weight:650;margin:18px 0 7px}input{width:100%;box-sizing:border-box;font-size:20px;padding:13px;border:1px solid #cbd5e1;border-radius:9px}button{width:100%;background:#2463db;color:white;border:0;border-radius:10px;padding:15px;font-size:18px;font-weight:700;margin-top:23px;cursor:pointer}.results{margin-top:22px;background:#f0f5ff;padding:18px;border-radius:12px;display:none}.line{display:flex;justify-content:space-between;margin:10px 0;gap:15px}.total{font-size:23px;color:#1858c4;font-weight:750;border-top:1px solid #d7e2f5;padding-top:13px}.error{color:#b42318;margin-top:12px;min-height:20px;font-size:14px}.note{font-size:12px;line-height:1.6;color:#6b7280;margin-top:20px}</style></head><body><main class="wrap"><section class="panel"><h1>加班工時計算</h1><p class="hint">請輸入實際打卡時間，採 24 小時制（例如 0800 或 08:00）</p><label for="start">上班打卡時間</label><input id="start" inputmode="numeric" placeholder="例如 0800" autocomplete="off"><label for="end">下班打卡時間</label><input id="end" inputmode="numeric" placeholder="例如 1700" autocomplete="off"><button id="calc">計算工時</button><div id="error" class="error" role="alert"></div><div id="results" class="results" aria-live="polite"><div class="line"><span>跨日判定</span><strong id="overnight"></strong></div><div class="line"><span>打卡總時數</span><strong id="elapsed"></strong></div><div class="line"><span>自動扣休</span><strong id="breaktime"></strong></div><div class="line"><span>扣休後工時</span><strong id="net"></strong></div><div class="line total"><span>給付時數</span><span id="pay"></span></div></div><p class="note">依公司指定方式試算：每連續工作 4 小時後安排 30 分鐘休息；剛好滿 4 小時不扣休，休息不計入下一段工作時間，給付時數採整小時。此為試算結果，正式核薪仍須依實際工作、休息紀錄及法令辦理。下班時間早於上班時間時，視為隔日下班；時間相同時不自動推定 24 小時。</p></section></main><script>
function parseTime(s){s=s.trim();let m=/^(\d{1,2}):(\d{2})$/.exec(s);if(!m){m=/^(\d{3,4})$/.exec(s);if(m){const v=m[1].padStart(4,'0');m=[null,v.slice(0,2),v.slice(2)];}}if(!m)return null;const h=Number(m[1]),min=Number(m[2]);return h>=0&&h<24&&min>=0&&min<60?h*60+min:null;}
// 每一段 4 小時工作後，休息 30 分鐘。終點剛好落在工作段末端不扣。
// 以整分鐘計，休息不能超過打卡區間實際可用的分鐘數。
function calculate(minutes){let left=minutes,rest=0;while(left>240){left-=240;const take=Math.min(30,left);rest+=take;left-=take;}return {rest,net:minutes-rest,pay:Math.floor((minutes-rest)/60)};}
function formatMinutes(m){const h=Math.floor(m/60),n=m%60;return n===0?`${h} 小時`:`${h} 小時 ${n} 分鐘`;}
document.getElementById('calc').addEventListener('click',()=>{const s=parseTime(document.getElementById('start').value),e=parseTime(document.getElementById('end').value),err=document.getElementById('error'),result=document.getElementById('results');result.style.display='none';err.textContent='';if(s===null||e===null){err.textContent='請輸入正確的 24 小時制時間，例如 0800 或 08:00。';return;}if(s===e){err.textContent='上下班時間相同，請確認打卡資料。';return;}const overnight=e<s,mins=(e-s+1440)%1440;const r=calculate(mins);document.getElementById('overnight').textContent=overnight?'是（隔日下班）':'否';document.getElementById('elapsed').textContent=formatMinutes(mins);document.getElementById('breaktime').textContent=formatMinutes(r.rest);document.getElementById('net').textContent=formatMinutes(r.net);document.getElementById('pay').textContent=r.pay+' 小時';result.style.display='block';});
</script></body></html>
