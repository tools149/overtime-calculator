<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加班工時計算</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243a;font-family:system-ui,'Microsoft JhengHei',sans-serif}.wrap{max-width:540px;margin:30px auto;padding:30px;background:white;border-radius:16px;box-shadow:0 8px 30px #152b4714}h1{font-size:26px;margin:0 0 10px}.hint{color:#66788c;font-size:14px;margin-bottom:28px}label{display:block;margin:20px 0 8px;font-weight:600}input{width:100%;padding:15px;font-size:22px;border:1px solid #ccd4df;border-radius:9px}button{width:100%;padding:15px;margin-top:26px;background:#2563db;color:white;border:0;border-radius:9px;font-size:18px;font-weight:bold;cursor:pointer}.result{background:#edf3ff;border-radius:12px;padding:20px;margin-top:26px}.line{display:flex;justify-content:space-between;gap:16px;margin:12px 0}.line strong{text-align:right}.paid{border-top:1px solid #cdd9ee;padding-top:15px;font-size:21px;color:#1759bd}.error{color:#bb2020;margin-top:14px}.foot{color:#66788c;font-size:12px;margin-top:18px}@media(max-width:600px){.wrap{margin:12px;padding:22px}}</style></head><body><main class="wrap"><h1>加班工時計算</h1><p class="hint">請輸入實際打卡時間，採 24 小時制（例如 0908 或 09:08）<br><strong style="color:#a35308">跨日範例：上班 1700、隔日凌晨 0300（請勿輸入 2500）</strong></p><label for="start">上班打卡時間</label><input id="start" inputmode="numeric" placeholder="例如 0900"><label for="end">下班打卡時間</label><input id="end" inputmode="numeric" placeholder="例如 2000"><button id="calc">計算工時</button><div id="error" class="error" role="alert"></div><section id="result" class="result" hidden><div class="line"><span>跨日判定</span><strong id="cross"></strong></div><div class="line"><span>打卡總時數</span><strong id="elapsed"></strong></div><div class="line"><span>自動扣休</span><strong id="rest"></strong></div><div class="line"><span>扣休後工時</span><strong id="net"></strong></div><div class="line paid"><span>公司規則給付時數</span><strong id="paid"></strong></div></section><p class="foot">依公司提供之加班工時計算表試算；正式核薪仍應依實際休息與法令規定辦理。</p></main><script>
function parseTime(s){s=s.trim().replace(':','');if(!/^\d{3,4}$/.test(s))throw Error('請輸入24小時制時間，例如 0908 或 09:08');s=s.padStart(4,'0');const h=Number(s.slice(0,2)),m=Number(s.slice(2));if(h>23||m>59)throw Error('請使用 24 小時制（00:00～23:59）。跨日凌晨 3 點請輸入 0300，不是 2500。');return h*60+m}
function fmt(n){return `${Math.floor(n/60)} 小時 ${String(n%60).padStart(2,'0')} 分鐘`}
function calculateMinutes(a,b){if(a===b)throw Error('上下班時間相同，請確認是否跨越24小時');const cross=b<a,elapsed=(b-a+1440)%1440,rest=Math.floor(elapsed/270)*30,net=elapsed-rest;return {cross,elapsed,rest,net,paid:Math.floor(net/60)}}
function calculate(){const err=document.getElementById('error'),res=document.getElementById('result');err.textContent='';res.hidden=true;try{const v=calculateMinutes(parseTime(document.getElementById('start').value),parseTime(document.getElementById('end').value));for(const [k,val] of Object.entries({cross:v.cross?'是':'否',elapsed:fmt(v.elapsed),rest:fmt(v.rest),net:fmt(v.net),paid:v.paid+' 小時'}))document.getElementById(k).textContent=val;res.hidden=false}catch(e){err.textContent=e.message}}
document.getElementById('calc').addEventListener('click',calculate);document.querySelectorAll('input').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')calculate()}));
</script></body></html>
